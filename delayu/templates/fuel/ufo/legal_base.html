<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d2e" />
  <title>{% block title %}{{ page_brand }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #10241c;
      --muted: #5a6f65;
      --line: #d7e3dc;
      --brand: #0f3d2e;
      --brand-2: #1f6b4f;
      --accent: #e8f5ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      background: #dfe8e3;
      padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    .brand {
      display: inline-block;
      background: var(--brand);
      color: #f3faf6;
      border-radius: 14px;
      padding: 10px 14px;
      text-decoration: none;
      margin-bottom: 14px;
    }
    .brand b { display: block; font-size: 14px; }
    .brand span { display: block; font-size: 11px; opacity: .82; font-weight: 500; margin-top: 2px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
    }
    h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: -.02em; }
    p, li { font-size: 14px; line-height: 1.55; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-weight: 500; }
    ol { margin: 0 0 14px; padding-left: 20px; }
    li { margin-bottom: 8px; }
    a { color: var(--brand-2); }
    .back {
      display: inline-block;
      margin-top: 8px;
      background: var(--accent);
      color: var(--brand);
      text-decoration: none;
      font-weight: 700;
      border-radius: 12px;
      padding: 11px 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="{{ app_url }}">
      <b>Топливный пропуск</b>
      <span>Карта АЗС ЮФО</span>
    </a>
    <div class="card">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>

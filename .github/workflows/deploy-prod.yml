# Деплой prod: job выполняется НА VPS (self-hosted runner).
# Jino блокирует inbound SSH и HTTPS с IP GitHub — runner ходит к GitHub сам.
#
# Настройка: deploy/setup-github-runner.sh
# Запасной вариант без runner: cron deploy/cron-git-autodeploy.sh (каждые 5 мин)

name: Deploy production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, delayu]
    steps:
      - name: Pull and deploy on server
        run: |
          set -euo pipefail
          cd /opt/delayu
          git config --global --add safe.directory /opt/delayu || true
          echo '--- service ---'
          systemctl is-active delayu || true
          echo '--- home render ---'
          .venv/bin/python manage.py shell -c "from django.contrib.auth import get_user_model; from django.test import Client; u=get_user_model().objects.get(username='uzhv_spec'); c=Client(HTTP_HOST='delau.tech'); c.force_login(u); r=c.get('/'); print('status', r.status_code, 'len', len(r.content)); b=r.content.decode('utf-8','replace'); print('spec', 'welcome-spec' in b, 'icon', 'icon-base ri ri-' in b); print(b[:500] if r.status_code>=400 else 'ok')"
          echo '--- nginx ---'
          tail -30 /var/log/nginx/error.log 2>/dev/null || true

# Деплой prod: job выполняется НА VPS (self-hosted runner).
# Jino блокирует inbound SSH и HTTPS с IP GitHub — runner ходит к GitHub сам.
#
# Настройка: deploy/setup-github-runner.sh
# Запасной вариант без runner: cron deploy/cron-git-autodeploy.sh (каждые 5 мин)

name: Deploy production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, delayu]
    steps:
      - name: Pull and deploy on server
        run: |
          set -euo pipefail
          # Runner = delayu. sudoers allows only webhook-run.sh / run-deploy.sh (NOPASSWD).
          cd /opt/delayu
          git config --global --add safe.directory /opt/delayu || true
          git fetch origin main
          git checkout -f -B main origin/main
          cp deploy/run-deploy.sh deploy/run-deploy.sh.bak-https
          cp deploy/enable-https.sh deploy/run-deploy.sh
          chmod +x deploy/run-deploy.sh deploy/enable-https.sh
          sudo /opt/delayu/deploy/run-deploy.sh || true
          cp deploy/run-deploy.sh.bak-https deploy/run-deploy.sh

# Деплой prod: job выполняется НА VPS (self-hosted runner).
# Jino блокирует inbound SSH и HTTPS с IP GitHub — runner ходит к GitHub сам.
#
# Настройка: deploy/setup-github-runner.sh
# Запасной вариант без runner: cron deploy/cron-git-autodeploy.sh (каждые 5 мин)

name: Deploy production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, delayu]
    steps:
      - name: Pull and deploy on server
        run: |
          set -euo pipefail
          # Runner = delayu. sudoers allows only webhook-run.sh / run-deploy.sh (NOPASSWD).
          cd /opt/delayu
          git config --global --add safe.directory /opt/delayu || true
          echo '--- listeners ---'
          ss -ltn || true
          echo '--- nginx sites ---'
          ls -l /etc/nginx/sites-enabled 2>/dev/null || true
          echo '--- nginx T listen ---'
          sudo -n nginx -T 2>/dev/null | awk '/server_name|listen |ssl_certificate /' || echo 'nginx -T denied'
          echo '--- ufw ---'
          sudo -n ufw status 2>/dev/null || echo 'ufw denied'
          echo '--- iptables 443 ---'
          sudo -n iptables -L INPUT -n 2>/dev/null | head -40 || echo 'iptables denied'

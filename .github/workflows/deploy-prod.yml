# Деплой prod: job выполняется НА VPS (self-hosted runner).
# Jino блокирует inbound SSH и HTTPS с IP GitHub — runner ходит к GitHub сам.
#
# Настройка: deploy/setup-github-runner.sh
# Запасной вариант без runner: cron deploy/cron-git-autodeploy.sh (каждые 5 мин)

name: Deploy production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, delayu]
    steps:
      - name: Pull and deploy on server
        run: |
          set -euo pipefail
          # Runner = delayu. sudoers allows only webhook-run.sh / run-deploy.sh (NOPASSWD).
          cd /opt/delayu
          git config --global --add safe.directory /opt/delayu || true
          echo '--- listen ---'
          ss -ltn | awk 'NR==1 || /:443|:80|:8000/' || true
          echo '--- nginx ---'
          systemctl is-active nginx || true
          echo '--- public ip ---'
          curl -skS -m 10 -o /dev/null -w 'ip %{http_code}\n' --resolve delau.tech:443:81.177.141.93 https://delau.tech/auth/login/ || true
          echo '--- http ---'
          curl -sS -m 8 -o /dev/null -w 'http %{http_code}\n' --resolve delau.tech:80:81.177.141.93 http://delau.tech/auth/login/ || true

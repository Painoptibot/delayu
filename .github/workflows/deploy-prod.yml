# Деплой prod: job выполняется НА VPS (self-hosted runner).
# Jino блокирует inbound SSH и HTTPS с IP GitHub — runner ходит к GitHub сам.
#
# Настройка: deploy/setup-github-runner.sh
# Запасной вариант без runner: cron deploy/cron-git-autodeploy.sh (каждые 5 мин)

name: Deploy production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, delayu]
    steps:
      - name: Pull and deploy on server
        run: |
          set -euo pipefail
          # Runner = delayu. sudoers allows only webhook-run.sh / run-deploy.sh (NOPASSWD).
          cd /opt/delayu
          git config --global --add safe.directory /opt/delayu || true
          echo '--- active ---'
          systemctl is-active delayu || true
          echo '--- local ---'
          curl -sS -m 8 -o /dev/null -w 'local %{http_code}\n' http://127.0.0.1:8000/auth/login/ || true
          echo '--- public ---'
          curl -skS -m 8 -o /dev/null -w 'public %{http_code}\n' https://127.0.0.1/auth/login/ -H 'Host: delau.tech' || true
          echo '--- error ---'
          tail -60 /opt/delayu/logs/gunicorn-error.log || true
          echo '--- access ---'
          tail -15 /opt/delayu/logs/gunicorn-access.log || true
